name: Release Consumers

on:
  workflow_run:
    workflows: [Check]
    types: [completed]
  workflow_dispatch:
    inputs:
      vellum_sha:
        description: Vellum UI commit SHA to release.
        required: false
        type: string

permissions:
  # write so the release can push the version-bump commit back to vellum main
  # (see bumpVellumVersion in scripts/release-consumers.mjs).
  contents: write

concurrency:
  group: release-consumers-${{ github.event.workflow_run.head_sha || inputs.vellum_sha || github.sha }}
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.vellum_sha || github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run check
      - name: Check release token
        id: release-token
        env:
          GH_TOKEN: ${{ secrets.BENSON_RELEASE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "BENSON_RELEASE_TOKEN is not configured; skipping downstream release."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Release downstream consumers
        if: steps.release-token.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ secrets.BENSON_RELEASE_TOKEN }}
          VELLUM_UI_SHA: ${{ inputs.vellum_sha || github.event.workflow_run.head_sha || github.sha }}
        run: npm run release:consumers
